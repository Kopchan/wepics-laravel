server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 4096M;
    client_body_timeout 300s;

    # Static cache: thumbs / assets
    location ~* \.(jpg|jpeg|png|gif|webp|avif|mp4|webm|mp3|ogg|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
        # Pass the X-Accel-* headers to facilitate testing.
        fastcgi_pass_header "X-Accel-Buffering";
        fastcgi_pass_header "X-Accel-Charset";
        fastcgi_pass_header "X-Accel-Expires";
        fastcgi_pass_header "X-Accel-Limit-Rate";
        fastcgi_pass_header "X-Accel-Redirect";
        # Headers for accel redirect (mirrors .ddev/nginx_full/nginx-site.conf).
        # Laravel uses them only when TRUST_X_SENDFILE_HEADER=true.
        fastcgi_param HTTP_X_SENDFILE_TYPE X-Accel-Redirect;
        fastcgi_param HTTP_X_ACCEL_MAPPING /var/www/html/storage/app/=/protected_storage/;
    }

    # Private location for storage files served via response()->file().
    # `^~` (not plain prefix like in DDEV) wins over the static-files regex above.
    location ^~ /protected_storage/ {
        internal;
        alias /var/www/html/storage/app/;
    }

    location ~ /\.ht {
        deny all;
    }
}
